# AeroSpace config (Mac tiling window manager) matching Omarchy's shortcuts.
# Copy to ~/.aerospace.toml on the Mac.
#
# On a Mac, the Corne turns Super + arrows / numbers into Ctrl+Option+Cmd + the
# same key, so these bindings don't clash with the Mac's own Cmd shortcuts.
# With a regular keyboard, press Ctrl+Option+Cmd directly.

config-version = 2

start-at-login = true

# Tile like Hyprland: windows split the screen automatically.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Follow the focused window across monitors with the mouse.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Pin workspaces to monitors like Omarchy's monitor-profile script:
# 1 = built-in screen, 2 = ultrawide, 3 = vertical. Numbers are monitor
# positions counted from the left. Other workspaces open on the focused monitor.
# 1-3 always exist, so each monitor starts on its own workspace.
persistent-workspaces = ['1', '2', '3']

[workspace-to-monitor-force-assignment]
1 = 'built-in'
2 = 2
3 = 3

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Super + arrows: focus the window in that direction, crossing to the next
# monitor at a screen edge (like Hyprland).
ctrl-alt-cmd-left = 'focus --boundaries all-monitors-outer-frame left'
ctrl-alt-cmd-down = 'focus --boundaries all-monitors-outer-frame down'
ctrl-alt-cmd-up = 'focus --boundaries all-monitors-outer-frame up'
ctrl-alt-cmd-right = 'focus --boundaries all-monitors-outer-frame right'

# Super + Shift + arrows: move (swap) the window in that direction, crossing
# to the next monitor at a screen edge.
ctrl-alt-cmd-shift-left = 'move --boundaries all-monitors-outer-frame left'
ctrl-alt-cmd-shift-down = 'move --boundaries all-monitors-outer-frame down'
ctrl-alt-cmd-shift-up = 'move --boundaries all-monitors-outer-frame up'
ctrl-alt-cmd-shift-right = 'move --boundaries all-monitors-outer-frame right'

# Super + number: switch to that workspace.
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'
ctrl-alt-cmd-6 = 'workspace 6'
ctrl-alt-cmd-7 = 'workspace 7'
ctrl-alt-cmd-8 = 'workspace 8'
ctrl-alt-cmd-9 = 'workspace 9'
ctrl-alt-cmd-0 = 'workspace 10'

# Super + Shift + number: send the window to that workspace and follow it.
# 1-3 stay on their own monitors. 4-10 are brought to the monitor you're on
# (AeroSpace would otherwise create them on the main monitor).
ctrl-alt-cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
ctrl-alt-cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
ctrl-alt-cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
ctrl-alt-cmd-shift-4 = ['move-node-to-workspace 4', 'summon-workspace 4']
ctrl-alt-cmd-shift-5 = ['move-node-to-workspace 5', 'summon-workspace 5']
ctrl-alt-cmd-shift-6 = ['move-node-to-workspace 6', 'summon-workspace 6']
ctrl-alt-cmd-shift-7 = ['move-node-to-workspace 7', 'summon-workspace 7']
ctrl-alt-cmd-shift-8 = ['move-node-to-workspace 8', 'summon-workspace 8']
ctrl-alt-cmd-shift-9 = ['move-node-to-workspace 9', 'summon-workspace 9']
ctrl-alt-cmd-shift-0 = ['move-node-to-workspace 10', 'summon-workspace 10']
